<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DashCore — Restablecer contraseña</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #03070a;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;

      padding: 32px;

      background: #071017;

      border: 1px solid #1d536b;
      border-radius: 18px;

      box-shadow:
        0 0 35px rgba(0, 180, 255, 0.15);
    }

    .logo {
      text-align: center;

      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;

      color: #29b6ff;

      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;

      color: #8fa3ad;

      margin-bottom: 30px;
    }

    h1 {
      margin: 0 0 10px;

      text-align: center;

      font-size: 24px;
    }

    .description {
      margin-bottom: 25px;

      text-align: center;

      color: #9eabb2;

      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: #cbd6db;

      font-size: 14px;
    }

    input {
      display: block;

      width: 100%;

      padding: 14px;

      margin-bottom: 18px;

      border: 1px solid #1d333e;
      border-radius: 10px;

      background: #03070a;
      color: #ffffff;

      font-size: 15px;

      outline: none;

      box-sizing: border-box;
    }

    input:focus {
      border-color: #29b6ff;
    }

    button {
      display: block;

      width: 100%;

      padding: 14px;

      border: 0;
      border-radius: 10px;

      background: #29b6ff;
      color: #001018;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #form {
      display: none;
    }

    #message {
      display: none;

      margin-top: 18px;
      padding: 12px;

      border-radius: 9px;

      text-align: center;

      font-size: 14px;
      line-height: 1.4;
    }

    #message.success {
      display: block;

      background: rgba(62, 229, 139, 0.1);
      border: 1px solid rgba(62, 229, 139, 0.4);

      color: #3ee58b;
    }

    #message.error {
      display: block;

      background: rgba(255, 83, 100, 0.1);
      border: 1px solid rgba(255, 83, 100, 0.4);

      color: #ff5364;
    }

    .back {
      display: block;

      margin-top: 22px;

      text-align: center;

      color: #29b6ff;

      text-decoration: none;

      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">
      DASHCORE
    </div>

    <div class="subtitle">
      Vehicle Dashboard System
    </div>

    <h1>
      Restablecer contraseña
    </h1>

    <div class="description">
      Introduce tu nueva contraseña para recuperar el acceso a tu cuenta.
    </div>

    <form id="form">

      <label for="password">
        Nueva contraseña
      </label>

      <input
        id="password"
        type="password"
        minlength="6"
        autocomplete="new-password"
        placeholder="Nueva contraseña"
        required
      >

      <label for="confirmPassword">
        Confirmar contraseña
      </label>

      <input
        id="confirmPassword"
        type="password"
        minlength="6"
        autocomplete="new-password"
        placeholder="Repite la contraseña"
        required
      >

      <button
        id="submitButton"
        type="submit"
      >
        Cambiar contraseña
      </button>

    </form>

    <div id="message"></div>

    <a
      class="back"
      href="index.html"
    >
      ← Volver a DashCore
    </a>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://pvcfwpziojocogfctgbw.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_4t_Vq6QlMSK5EMVVxY7d0w_g-oY3QiC";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    const form =
      document.getElementById("form");

    const message =
      document.getElementById("message");

    const submitButton =
      document.getElementById("submitButton");


    function showMessage(text, type) {

      message.textContent = text;

      message.className = type;

    }


    async function initialize() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {

          console.error(
            "RESET SESSION ERROR:",
            error
          );

          showMessage(
            "No se pudo verificar el enlace.",
            "error"
          );

          return;
        }


        if (!data.session) {

          showMessage(
            "El enlace de recuperación no es válido o ha expirado.",
            "error"
          );

          return;
        }


        form.style.display = "block";


      } catch (error) {

        console.error(
          "RESET INIT ERROR:",
          error
        );

        showMessage(
          "No se pudo verificar el enlace de recuperación.",
          "error"
        );

      }

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const password =
          document.getElementById(
            "password"
          ).value;


        const confirmPassword =
          document.getElementById(
            "confirmPassword"
          ).value;


        if (password.length < 6) {

          showMessage(
            "La contraseña debe tener al menos 6 caracteres.",
            "error"
          );

          return;
        }


        if (
          password !==
          confirmPassword
        ) {

          showMessage(
            "Las contraseñas no coinciden.",
            "error"
          );

          return;
        }


        submitButton.disabled = true;

        submitButton.textContent =
          "Cambiando contraseña...";


        try {

          const {
            error
          } =
            await supabaseClient.auth.updateUser({
              password: password
            });


          if (error) {

            console.error(
              "RESET UPDATE ERROR:",
              error
            );

            showMessage(
              error.message ||
              "No se pudo cambiar la contraseña.",
              "error"
            );

            submitButton.disabled = false;

            submitButton.textContent =
              "Cambiar contraseña";

            return;
          }


          showMessage(
            "Contraseña cambiada correctamente. Ya puedes iniciar sesión.",
            "success"
          );


          form.style.display = "none";


          await supabaseClient.auth.signOut();


        } catch (error) {

          console.error(
            "RESET ERROR:",
            error
          );

          showMessage(
            "Ocurrió un error al cambiar la contraseña.",
            "error"
          );

          submitButton.disabled = false;

          submitButton.textContent =
            "Cambiar contraseña";

        }

      }
    );


    initialize();

  </script>

</body>
</html>
