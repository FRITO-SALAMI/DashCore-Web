<body>

  <div class="card">

    <div class="logo">DASHCORE</div>
    <div class="subtitle">Vehicle Dashboard System</div>

    <h1>Restablecer contraseña</h1>

    <div class="description">
      Introduce tu nueva contraseña para recuperar el acceso a tu cuenta.
    </div>

    <form id="form">

      <label for="password">Nueva contraseña</label>

      <input
        id="password"
        type="password"
        minlength="6"
        autocomplete="new-password"
        placeholder="Nueva contraseña"
        required
      >

      <label for="confirmPassword">Confirmar contraseña</label>

      <input
        id="confirmPassword"
        type="password"
        minlength="6"
        autocomplete="new-password"
        placeholder="Repite la contraseña"
        required
      >

      <button id="submitButton" type="submit">
        Cambiar contraseña
      </button>

    </form>

    <div id="message"></div>

    <a class="back" href="index.html">
      ← Volver a DashCore
    </a>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://pvcfwpziojocogfctgbw.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_4t_Vq6QlMSK5EMVVxY7d0w_g-oY3QiC";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const form = document.getElementById("form");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    async function initialize() {
      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error || !data.session) {
          showMessage(
            "El enlace de recuperación no es válido o ha expirado.",
            "error"
          );
          return;
        }

        form.style.display = "block";

      } catch (error) {
        console.error(error);

        showMessage(
          "No se pudo verificar el enlace de recuperación.",
          "error"
        );
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 6) {
        showMessage(
          "La contraseña debe tener al menos 6 caracteres.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "Las contraseñas no coinciden.",
          "error"
        );
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent =
        "Cambiando contraseña...";

      try {
        const { error } =
          await supabaseClient.auth.updateUser({
            password: password
          });

        if (error) {
          console.error(error);

          showMessage(
            error.message ||
            "No se pudo cambiar la contraseña.",
            "error"
          );

          submitButton.disabled = false;
          submitButton.textContent =
            "Cambiar contraseña";

          return;
        }

        showMessage(
          "Contraseña cambiada correctamente. Ya puedes iniciar sesión.",
          "success"
        );

        form.style.display = "none";

        await supabaseClient.auth.signOut();

      } catch (error) {
        console.error(error);

        showMessage(
          "Ocurrió un error al cambiar la contraseña.",
          "error"
        );

        submitButton.disabled = false;
        submitButton.textContent =
          "Cambiar contraseña";
      }
    });

    initialize();
  </script>

</body>
</html>
